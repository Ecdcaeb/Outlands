# git-cliff configuration for the Outlands changelog and release notes.
#
# Releases pass an explicit commit range and CalVer version. This avoids SemVer tag ordering,
# which places a same-day suffix such as 2026.11.03-2 before 2026.11.03.
#
# Sections follow conventional commit types; commits retain their commit order.
# GitHub API data adds PR and author links when available. Use GITHUB_TOKEN or
# --github-token to avoid anonymous API rate limits.

[changelog]
# Generate one release body. The workflow inserts it into CHANGELOG.md, preserving the header.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - [`{{ commit.id | truncate(length=7, end="") }}`](<REPO>/commit/{{ commit.id }}) - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}{% if commit.remote.pr_number %} *(PR [#{{ commit.remote.pr_number }}](<REPO>/pull/{{ commit.remote.pr_number }}) by [@{{ commit.remote.username }}](<GH>/{{ commit.remote.username }}))*{% elif commit.remote.username %} *(commit by [@{{ commit.remote.username }}](<GH>/{{ commit.remote.username }}))*{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
# Replace URL placeholders after rendering. Update the repository URL for forks.
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/Project-Outlands/Outlands" },
  { pattern = '<GH>', replace = "https://github.com" },
]

[git]
conventional_commits = true
# Include non-conventional commits in the Other section.
filter_unconventional = false
# Remove the trailing squash-merge PR number; the template adds a link from GitHub data.
commit_preprocessors = [
  { pattern = '(?m)\s*\(#\d+\)$', replace = '' },
]
# HTML comment prefixes set section order and are removed from the rendered headings.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^test", group = "<!-- 4 -->🧪 Testing" },
  { message = "^chore", group = "<!-- 5 -->⚙️ Miscellaneous Tasks" },
  # Omit documentation, formatting, build, and CI commits from release notes.
  { message = "^docs?", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = ".*", group = "<!-- 6 -->💼 Other" },
]
