title: Feature proposal title
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Summarize the proposed feature in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goals
      placeholder: What should this proposal achieve? Describe the intended outcomes.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: What is outside the scope of this proposal? Write None if there are no specific exclusions.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      placeholder: What problem does this solve, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe how the feature would work, with examples of its behavior and any relevant limitations or tradeoffs.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: List any required proposals or external projects, with links where possible. Write None if there are no dependencies.
  - type: textarea
    id: references
    attributes:
      label: References
      placeholder: Link to related discussions, documentation, papers, or other sources.
  - type: checkboxes
    id: acknowledge
    attributes:
      label: Guidelines
      description: |
          Read the [Outlands Feature Proposal Guidelines](https://github.com/Project-Outlands/Outlands/blob/main/CFP_GUIDELINES.md) before submitting.
      options:
        - label: I have read the guidelines and will follow them throughout this proposal.
          required: true
