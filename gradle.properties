# Project
title = Outlands
vendor = Outlands

last_forge_version = 14.23.5.2864

# Minecraft and mappings
mapping_channel = stable
mapping_version = 39-1.12
minecraft_version = 1.12.2
mcp_version = 20261022.224414

# Libraries
asm_version = 9.11.1
asm_deprecated = 7.1
netty_version = 4.2.19.Final
lwjgl_version = 3.4.3

# Nsight Graphics (optional)
# Activities: Frame Debugger, Graphics Capture, GPU Trace Profiler.
# CLI reference: https://docs.nvidia.com/nsight-graphics/UserGuide/launch-application-overview.html#cli-arguments-details
nsight_activity = Frame Debugger
# Windows example: C:\\Program Files\\NVIDIA Corporation\\Nsight Graphics <version>\\host\\windows-desktop-nomad-x64\\ngfx.exe
nsight_ngfx_path =

# Gradle
# Heap available to Gradle and the Minecraft decompilation pipeline.
org.gradle.jvmargs = -Xmx4G
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.daemon = false
# To select a JDK explicitly, set org.gradle.java.home to its JDK 25 installation directory.